server:
  port: 8080

spring:
  application:
    name: it-service-desk
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/it_service_desk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:itsd}
    password: ${DB_PASSWORD:itsd123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

file:
  upload-dir: ${FILE_UPLOAD_DIR:D:/DeepSeek_data/gradaute_space/it-service-desk/uploads}

# 通知渠道（企微群机器人）：webhook 留空 = 功能关闭
# 配置方法：维修班企微群 → 群设置 → 群机器人 → 添加机器人 → 复制 Webhook 地址填到下方
notify:
  wecom:
    webhook: ${NOTIFY_WECOM_WEBHOOK:}
  # 对外访问地址（手机点通知里的链接用，填手机能访问到的后端地址，如 http://192.168.1.100:8080）
  public-host: ${NOTIFY_PUBLIC_HOST:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto