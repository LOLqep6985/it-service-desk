<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#14201C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IT运维工单">
  <link rel="manifest" href="/manifest-repairer.json">
  <link rel="icon" href="/icons/repair-192.png">
  <link rel="apple-touch-icon" href="/icons/repair-192.png">
  <title>登录 - IT运维工单系统</title>
  <style>
    /* 登录页 —— 纸白底 + 墨青，入口气质与报修端同族 */
    :root {
      --c-primary: #0F6B5C;
      --c-primary-dark: #0B5448;
      --c-bg: #F6F4EE;
      --c-surface: #FFFFFF;
      --c-surface-2: #F0EDE4;
      --c-text: #1C2420;
      --c-muted: #6E7770;
      --c-danger: #B3261E;
      --c-accent: #A67C3D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; background: var(--c-bg); color: var(--c-text); }
    .container { max-width: 420px; margin: 0 auto; padding: 72px 24px; }
    .brand { width: 52px; height: 52px; border-radius: 13px; background: var(--c-primary); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800;
      margin: 0 auto 18px; box-shadow: inset 0 -4px 0 var(--c-accent); }
    h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; text-align: center; }
    .sub { text-align: center; color: var(--c-muted); margin: 10px 0 36px; font-size: 14px; }
    input { width: 100%; padding: 15px; margin-bottom: 14px; border: none; border-radius: 10px; font-size: 16px; background: var(--c-surface); color: var(--c-text); font-family: inherit; }
    input:focus { outline: 2px solid var(--c-primary); outline-offset: -1px; }
    button { width: 100%; padding: 16px; background: var(--c-primary); color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; letter-spacing: .06em; cursor: pointer; }
    button:active { background: var(--c-primary-dark); }
    .msg { margin-top: 14px; text-align: center; color: var(--c-danger); font-size: 14px; min-height: 20px; }
    details { margin-top: 30px; }
    summary { cursor: pointer; color: var(--c-muted); font-size: 13px; }
    .hint { margin-top: 10px; padding: 14px; background: var(--c-surface); border-radius: 10px; font-size: 13px; color: var(--c-muted); line-height: 1.9; }
  </style>
</head>
<body>
<div class="container">
  <div class="brand">IT</div>
  <h1>IT 运维工单系统</h1>
  <p class="sub">多院区现场维修调度</p>
  <input id="username" placeholder="用户名" autocomplete="username">
  <input id="password" type="password" placeholder="密码">
  <button id="loginBtn">登 录</button>
  <div id="msg" class="msg"></div>
  <details>
    <summary>演示账号</summary>
    <div class="hint">
      维修工：repairer1 / 123456（张工）<br>
      维修工：repairer2 / 123456（李工）<br>
      报修人：reporter1 / 123456（王护士）<br>
      管理员：admin / admin123<br>
      财务：finance / 123456
    </div>
  </details>
  <div style="margin-top:24px;text-align:center;">
    <a href="report.html" style="color:#0F6B5C;text-decoration:none;font-size:14px;font-weight:600;">科室免登录报修入口 →</a>
  </div>
</div>
<script>
  const loginBtn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  loginBtn.addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    msg.textContent = '';
    if (!username || !password) { msg.textContent = '请输入用户名和密码'; return; }
    msg.textContent = '登录中...';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const json = await res.json();
      if (json.code !== 0) { msg.textContent = json.message; return; }
      localStorage.setItem('itsdUser', JSON.stringify(json.data));
      const roleCode = json.data.roleCode;
const uid = json.data.userId;
if (roleCode === 'REPORTER') {
  window.location.href = 'create.html?userId=' + uid;
} else if (roleCode === 'REPAIRER') {
  window.location.href = 'today.html?userId=' + uid;
} else {
  // 管理员 / 调度员 / 财务 → PC 管理后台（后台再按角色渲染菜单）
  window.location.href = 'admin.html';
}
    } catch (e) {
      msg.textContent = '网络错误：' + e.message;
    }
  });
</script>
<script>
  // PWA：注册 Service Worker（HTTPS 或 localhost 下生效）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/service-worker.js').catch(function () {});
    });
  }
</script>
<script src="/js/pwa-install.js"></script>
</body>
</html>
