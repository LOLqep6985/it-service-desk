<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1d6fe0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="维修工作台">
  <link rel="manifest" href="/manifest-repairer.json">
  <link rel="icon" href="/icons/repair-192.png">
  <link rel="apple-touch-icon" href="/icons/repair-192.png">
  <title>今日任务 - IT运维工单系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f4f7; color: #2c3e50; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #1d6fe0; color: #fff; position: sticky; top: 0; }
    .header .user { font-size: 15px; font-weight: 600; }
    .header .logout { background: rgba(255,255,255,.2); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; }
    .summary { font-size: 14px; color: #6b7280; margin-bottom: 12px; }
    .campus-group { margin-bottom: 18px; }
    .campus-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .campus-count { background: #1d6fe0; color: #fff; border-radius: 10px; font-size: 12px; padding: 2px 8px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
    .card:active { background: #f8fafc; }
    .card .title { font-size: 16px; font-weight: 600; }
    .card .meta { font-size: 13px; color: #6b7280; margin-top: 6px; line-height: 1.6; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 4px; margin-left: 6px; }
    .badge.urgent { background: #ffe3e3; color: #d63031; }
    .accept-btn { background: #1d6fe0; color: #fff; border: none; border-radius: 6px; padding: 3px 10px; font-size: 12px; margin-top: 4px; cursor: pointer; }
    .empty { text-align: center; color: #b0b8c1; padding: 60px 0; }
    .empty p { font-size: 15px; }
  </style>
</head>
<body>
<div class="header">
  <span class="user" id="userName">加载中...</span>
  <button class="logout" id="reportBtn" style="background:#f39c12;margin-right:8px;">＋ 报修</button><button class="logout" id="logoutBtn">退出</button>
</div>
<div class="container">
  <div class="summary" id="summary"></div>
  <div id="groups"></div>
</div>
<script>
  const WORK_ORDER_STATUS = { ASSIGNED:'待接单', IN_PROGRESS:'维修中', PENDING_PRICING:'待核价', PENDING_SIGN:'待签字', PENDING_REIMBURSE:'待报销', REIMBURSED:'已报销' };
  const CAMPUS_LABEL = { LAOYUAN:'老院', XIYUAN:'西院', DONGYUAN:'东院' };
  const params = new URLSearchParams(location.search);
  const userId = params.get('userId');
  const saved = localStorage.getItem('itsdUser');
  const user = saved ? JSON.parse(saved) : {};
  const token = user.token || '';

  // 角色兜底：非维修工不应停留在今日任务页
  if (user.roleCode === 'ADMIN' || user.roleCode === 'DISPATCHER' || user.roleCode === 'FINANCE') {
    window.location.href = 'admin.html?userId=' + (userId || user.userId);
  } else if (user.roleCode === 'REPORTER') {
    window.location.href = 'create.html?userId=' + (userId || user.userId);
  }
  if (!userId && user.userId) window.location.href = 'today.html?userId=' + user.userId;
  document.getElementById('userName').textContent = user.name + '（' + (user.role || '') + '）';

  // 只有报修人显示「+ 报修」按钮
  const reportBtn = document.getElementById('reportBtn');
  if (user.roleCode !== 'REPORTER') {
    reportBtn.style.display = 'none';
  }

  document.getElementById('reportBtn').addEventListener('click', () => {
  window.location.href = 'create.html?userId=' + userId;
});
document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('itsdUser');
    window.location.href = 'login.html';
  });

  async function load() {
    const res = await fetch('/api/work-orders/today', { headers: { 'X-Token': token } });
    const json = await res.json();
    if (json.code !== 0) { alert(json.message); return; }
    const list = json.data || [];
    document.getElementById('summary').textContent = '共 ' + list.length + ' 个待处理任务';
    const groups = {};
    const campusOrder = ['老院', '西院', '东院'];
    list.forEach(wo => {
      const key = CAMPUS_LABEL[wo.campus] || '其他';
      (groups[key] = groups[key] || []).push(wo);
    });
    const root = document.getElementById('groups');
    root.innerHTML = '';
    if (list.length === 0) {
      root.innerHTML = '<div class="empty"><p>今天没有待处理任务</p></div>';
      return;
    }
    campusOrder.forEach(campus => {
      const items = groups[campus];
      if (!items) return;
      const div = document.createElement('div');
      div.className = 'campus-group';
      div.innerHTML = '<div class="campus-title"><span>' + campus + '</span><span class="campus-count">' + items.length + '</span></div>';
      items.forEach(wo => {
        const urgent = wo.priority === 'HIGH' ? '<span class="badge urgent">紧急</span>' : '';
        div.innerHTML += '<div class="card" onclick="openDetail(' + wo.id + ')">'
          + '<div class="title">' + wo.title + urgent + '</div>'
          + '<div class="meta">' + wo.location + ' · ' + wo.contactPerson + '</div>'
          + '<div class="meta">' + wo.departmentName + ' · ' + (WORK_ORDER_STATUS[wo.status] || '')
          + (wo.status === 'ASSIGNED' ? ' <button class="accept-btn" onclick="event.stopPropagation();acceptOrder(' + wo.id + ')">接单</button>' : '')
          + '</div>'
          + '</div>';
      });
      root.appendChild(div);
    });
  }

  async function acceptOrder(id) {
    const res = await fetch('/api/work-orders/' + id + '/accept', { method: 'POST', headers: { 'X-Token': token } });
    const json = await res.json();
    if (json.code !== 0) { alert(json.message); return; }
    load();
  }

  function openDetail(id) {
    window.location.href = 'detail.html?id=' + id + '&userId=' + userId;
  }

  load();
</script>
<script>
  // PWA：注册 Service Worker（HTTPS 或 localhost 下生效）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/service-worker.js').catch(function () {});
    });
  }
</script>
</body>
</html>
