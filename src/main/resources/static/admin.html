<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14201C">
  <title>IT 运维工单 · 管理后台</title>
  <link rel="icon" href="/icons/repair-192.png">
  <link rel="apple-touch-icon" href="/icons/repair-192.png">
  <!-- 科室三级联动样式（科室索引视图复用 .floor-chip / 分组展示） -->
  <link rel="stylesheet" href="/css/dept-cascade.css">
  <!-- 后台主题与布局 -->
  <link rel="stylesheet" href="/css/admin-layout.css">
</head>
<body>
<!-- 本页只是「壳」：布局骨架 + 挂载点，业务逻辑分布在各 js/admin 模块中 -->
<div class="app-loading" id="app-loading">正在加载管理后台…</div>

<div class="layout" id="layout" hidden>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="body-row">
      <main class="content" id="content"></main>
    </div>
  </div>
</div>

<div class="toast-host" id="toast-host"></div>

<!-- 基础组件（顺序：工具类 → 状态 → UI 原子 → 路由 → 布局 → 视图 → 启动） -->
<script src="/js/department-cascade.js"></script>
<script src="/js/admin/api.js"></script>
<script src="/js/admin/store.js"></script>
<script src="/js/admin/ui.js"></script>
<script src="/js/admin/router.js"></script>
<script src="/js/admin/layout.js"></script>
<!-- 视图：新增视图只需在此追加一行 + 新建 views/xxx.js，无需改动其它文件 -->
<script src="/js/admin/views/dashboard.js"></script>
<script src="/js/admin/views/reports-pending.js"></script>
<script src="/js/admin/views/work-orders.js"></script>
<script src="/js/admin/views/reports-history.js"></script>
<script src="/js/admin/views/reimbursements.js"></script>
<script src="/js/admin/views/departments.js"></script>
<script src="/js/admin/views/users.js"></script>
<script src="/js/admin/views/system.js"></script>
<script src="/js/admin/app.js"></script>
</body>
</html>
