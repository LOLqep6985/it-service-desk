<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>报修 - IT运维工单系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f4f7; color: #2c3e50; }
    .header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #1d6fe0; color: #fff; position: sticky; top: 0; }
    .header .back { background: rgba(255,255,255,.2); border: none; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 14px; }
    .header .t { font-size: 16px; font-weight: 600; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .card h2 { font-size: 17px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #7f8c8d; margin: 12px 0 6px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    textarea { min-height: 80px; line-height: 1.5; }
    button.submit { width: 100%; padding: 15px; background: #1d6fe0; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; margin-top: 16px; }
    button.submit:disabled { background: #b0b8c1; }
    .msg { margin-top: 12px; text-align: center; font-size: 14px; color: #d63031; min-height: 20px; }
  </style>
</head>
<body>
<div class="header">
  <button class="back" id="backBtn">‹ 返回</button>
  <span class="t">发起报修</span>
</div>
<div class="container">
  <div class="card">
    <h2>填写故障信息</h2>
    <label>故障标题 *</label>
    <input id="title" placeholder="如：打印机无法打印">
    <label>所属科室 *</label>
    <select id="department"></select>
    <label>具体地点</label>
    <input id="location" placeholder="如：老院·门诊楼·三层 305 室">
    <label>联系人 *</label>
    <input id="contactPerson" placeholder="科室负责人/报修人姓名">
    <label>联系电话</label>
    <input id="contactPhone" placeholder="手机号或分机号">
    <label>优先级</label>
    <select id="priority">
      <option value="MEDIUM">一般（MEDIUM）</option>
      <option value="HIGH">紧急（HIGH）</option>
      <option value="LOW">低（LOW）</option>
    </select>
    <label>故障描述</label>
    <textarea id="description" placeholder="描述故障现象、发生时间等"></textarea>
    <button class="submit" id="submitBtn">提交报修</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const saved = localStorage.getItem('itsdUser');
  const user = saved ? JSON.parse(saved) : {};
  const userId = params.get('userId') || user.userId || '';
  const token = user.token || '';
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'today.html?userId=' + userId;
  });

  async function loadDepartments() {
    try {
      const res = await fetch('/api/departments', { headers: { 'X-Token': token } });
      const json = await res.json();
      if (json.code !== 0) { msg.textContent = json.message; return; }
      const sel = document.getElementById('department');
      (json.data || []).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.name + '（' + d.campus.label + '）';
        sel.appendChild(opt);
      });
    } catch (e) {
      msg.textContent = '加载科室失败：' + e.message;
    }
  }

  submitBtn.addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const departmentId = document.getElementById('department').value;
    const location = document.getElementById('location').value.trim();
    const contactPerson = document.getElementById('contactPerson').value.trim();
    const contactPhone = document.getElementById('contactPhone').value.trim();
    const priority = document.getElementById('priority').value;
    const description = document.getElementById('description').value.trim();
    if (!title || !departmentId || !contactPerson) {
      msg.textContent = '请填写故障标题、科室和联系人';
      return;
    }
    msg.textContent = '';
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/work-orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Token': token },
        body: JSON.stringify({ title, description, departmentId: Number(departmentId), location, contactPerson, contactPhone, priority })
      });
      const json = await res.json();
      if (json.code !== 0) { msg.textContent = json.message; submitBtn.disabled = false; return; }
      msg.style.color = '#27ae60';
      msg.textContent = '报修成功！工单已派给维修工 ✓';
      setTimeout(() => { window.location.href = 'today.html?userId=' + userId; }, 1200);
    } catch (e) {
      msg.textContent = '网络错误：' + e.message + '（内容已保留，请重试）';
      submitBtn.disabled = false;
    }
  });

  loadDepartments();
</script>
</body>
</html>
