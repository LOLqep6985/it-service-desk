<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="/css/dept-cascade.css">
  <title>报修 - IT运维工单系统</title>
  <style>
    /* 登录报修（报修人端）—— 纸白 + 墨青，与 report.html 同族 */
    :root {
      --c-primary: #0F6B5C;
      --c-primary-dark: #0B5448;
      --c-bg: #F6F4EE;
      --c-surface: #FFFFFF;
      --c-surface-2: #F0EDE4;
      --c-text: #1C2420;
      --c-text-2: #4A524D;
      --c-muted: #6E7770;
      --c-danger: #B3261E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; background: var(--c-bg); color: var(--c-text); }
    .header { display: flex; align-items: center; gap: 12px; padding: 16px 18px 10px; background: var(--c-bg); position: sticky; top: 0; z-index: 10; }
    .header .back { background: var(--c-surface-2); border: none; color: var(--c-text); padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .header .t { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .container { max-width: 520px; margin: 0 auto; padding: 8px 18px 48px; }
    .card { background: var(--c-surface); border-radius: 12px; padding: 22px 20px; }
    .card h2 { font-size: 21px; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.01em; }
    .tip { font-size: 13px; color: var(--c-muted); margin-bottom: 8px; }
    label { display: block; font-size: 13px; color: var(--c-text-2); margin: 14px 0 6px; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; box-sizing: border-box; background: var(--c-surface-2); color: var(--c-text); font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--c-primary); outline-offset: -1px; background: #fff; }
    textarea { min-height: 70px; line-height: 1.55; }
    button.submit { width: 100%; padding: 15px; background: var(--c-primary); color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; margin-top: 18px; cursor: pointer; letter-spacing: .02em; }
    button.submit:active { background: var(--c-primary-dark); }
    button.submit:disabled { background: #B9BDB4; }
    .msg { margin-top: 12px; text-align: center; font-size: 14px; color: var(--c-danger); min-height: 20px; }
  </style>
</head>
<body>
<div class="header">
  <span class="t">发起报修</span>
  <button class="back logout-btn" id="logoutBtn" style="margin-left:auto;">退出</button>
</div>
<div class="container">
  <div class="card">
    <h2>报修单</h2>
    <p class="tip">只填必要信息，设备详情由维修人员到场确认。</p>
    <label>院区 *</label>
    <select id="campusSelect"><option value="">请选择院区</option></select>
    <label>楼栋 *</label>
    <select id="buildingSelect" disabled><option value="">请先选择院区</option></select>
    <label>科室 *</label>
    <div class="picker" id="deptPicker">
      <button type="button" class="picker-value" id="deptPickerValue" disabled>请先选择楼栋<span class="arrow">▾</span></button>
      <div class="picker-panel" id="deptPickerPanel"></div>
    </div>
    <label>报修人姓名 *</label>
    <input id="reporterName" placeholder="如：李护士">
    <label>设备名称 *</label>
    <input id="deviceName" placeholder="如：打印机、电脑、显示器">
    <label>问题描述</label>
    <textarea id="problemDesc" placeholder="如：卡纸、缺墨、不亮、打不开机"></textarea>
    <label>科室负责人</label>
    <input id="departmentHead" placeholder="默认护士长，可填科室主任">
    <button class="submit" id="submitBtn">提交报修单</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="/js/department-cascade.js"></script>
<script src="/js/guard.js"></script>
<script>
  // 端守卫：只有报修人可停留本端；其他角色提示后强制退出回登录页（三端隔离，不跨端跳转）
  const guardUser = ItsdGuard.guard('reporter');
  if (!guardUser) throw new Error('blocked');
  const userId = guardUser.userId;
  const user = guardUser;
  const token = user.token || '';
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  document.getElementById('logoutBtn').addEventListener('click', () => {
    ItsdGuard.logout();
  });

  async function loadDepartments() {
    try {
      const res = await fetch('/api/departments', { headers: { 'X-Token': token } });
      const json = await res.json();
      if (json.code !== 0) { msg.textContent = json.message; return []; }
      return json.data || [];
    } catch (e) {
      msg.textContent = '加载科室失败：' + e.message;
      return [];
    }
  }

  // 三级联动（院区 → 楼栋 → 科室）：与科室端 report.html 共用组件
  const cascade = DeptCascade.create({
    campusEl: document.getElementById('campusSelect'),
    buildingEl: document.getElementById('buildingSelect'),
    wrapEl: document.getElementById('deptPicker'),
    valueEl: document.getElementById('deptPickerValue'),
    panelEl: document.getElementById('deptPickerPanel'),
    onSelect: (dept) => {
      msg.textContent = '';
      // 科室负责人：有默认值则自动带出并只读，无默认值时可手填
      const headInput = document.getElementById('departmentHead');
      headInput.value = dept ? (dept.departmentHead || '') : '';
      headInput.readOnly = !!(dept && dept.departmentHead);
    },
    onChange: () => { msg.textContent = ''; }
  });

  submitBtn.addEventListener('click', async () => {
    const dept = cascade.selected();
    const reporterName = document.getElementById('reporterName').value.trim();
    const deviceName = document.getElementById('deviceName').value.trim();
    const problemDesc = document.getElementById('problemDesc').value.trim();
    const departmentHead = document.getElementById('departmentHead').value.trim();
    if (!dept || !reporterName || !deviceName) {
      msg.textContent = '请选择科室，并填写报修人姓名和设备名称';
      return;
    }
    msg.textContent = '';
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/reports', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Token': token },
        body: JSON.stringify({ departmentId: dept.id, reporterName, deviceName, problemDesc, departmentHead })
      });
      const json = await res.json();
      if (json.code !== 0) { msg.textContent = json.message; submitBtn.disabled = false; return; }
      msg.style.color = '#27ae60';
      msg.textContent = '报修单已提交，待管理员受理';
      // 报修人停留本页，可继续报修其他设备
    } catch (e) {
      msg.textContent = '网络错误：' + e.message + '（内容已保留，请重试）';
      submitBtn.disabled = false;
    }
  });

  (async function init() {
    cascade.setDepartments(await loadDepartments());
  })();
</script>
<script>
  // PWA：注册 Service Worker（HTTPS 或 localhost 下生效）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/service-worker.js').catch(function () {});
    });
  }
</script>
</body>
</html>
