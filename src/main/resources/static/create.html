<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>报修 - IT运维工单系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f4f7; color: #2c3e50; }
    .header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #1d6fe0; color: #fff; position: sticky; top: 0; }
    .header .back { background: rgba(255,255,255,.2); border: none; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 14px; }
    .header .t { font-size: 16px; font-weight: 600; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .card h2 { font-size: 17px; margin-bottom: 4px; }
    .tip { font-size: 12px; color: #95a5a6; margin-bottom: 8px; }
    label { display: block; font-size: 13px; color: #7f8c8d; margin: 12px 0 6px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    textarea { min-height: 70px; line-height: 1.5; }
    button.submit { width: 100%; padding: 15px; background: #1d6fe0; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; margin-top: 16px; }
    button.submit:disabled { background: #b0b8c1; }
    .msg { margin-top: 12px; text-align: center; font-size: 14px; color: #d63031; min-height: 20px; }
  </style>
</head>
<body>
<div class="header">
  <button class="back" id="backBtn">‹ 返回</button>
  <span class="t">发起报修</span>
</div>
<div class="container">
  <div class="card">
    <h2>报修单</h2>
    <p class="tip">只填必要信息，设备详情由维修人员到场确认。</p>
    <label>科室 *</label>
    <select id="department"></select>
    <label>报修人姓名 *</label>
    <input id="reporterName" placeholder="如：李护士">
    <label>设备名称 *</label>
    <input id="deviceName" placeholder="如：打印机、电脑、显示器">
    <label>设备照片链接（可选）</label>
    <input id="devicePhoto" placeholder="可粘贴图片链接，Day3 支持拍照上传">
    <label>问题描述</label>
    <textarea id="problemDesc" placeholder="如：卡纸、缺墨、不亮、打不开机"></textarea>
    <label>科室负责人</label>
    <input id="departmentHead" placeholder="默认护士长，可填科室主任">
    <button class="submit" id="submitBtn">提交报修单</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
  const CAMPUS_LABEL = { LAOYUAN:'老院', XIYUAN:'西院', DONGYUAN:'东院' };
  const params = new URLSearchParams(location.search);
  const saved = localStorage.getItem('itsdUser');
  const user = saved ? JSON.parse(saved) : {};
  const userId = params.get('userId') || user.userId || '';
  const token = user.token || '';
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'login.html';
  });

  async function loadDepartments() {
    try {
      const res = await fetch('/api/departments', { headers: { 'X-Token': token } });
      const json = await res.json();
      if (json.code !== 0) { msg.textContent = json.message; return; }
      const sel = document.getElementById('department');
      (json.data || []).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.name + '（' + (CAMPUS_LABEL[d.campus] || d.campus) + '）';
        sel.appendChild(opt);
      });
    } catch (e) {
      msg.textContent = '加载科室失败：' + e.message;
    }
  }

  submitBtn.addEventListener('click', async () => {
    const departmentId = document.getElementById('department').value;
    const reporterName = document.getElementById('reporterName').value.trim();
    const deviceName = document.getElementById('deviceName').value.trim();
    const devicePhoto = document.getElementById('devicePhoto').value.trim();
    const problemDesc = document.getElementById('problemDesc').value.trim();
    const departmentHead = document.getElementById('departmentHead').value.trim();
    if (!departmentId || !reporterName || !deviceName) {
      msg.textContent = '请填写科室、报修人姓名和设备名称';
      return;
    }
    msg.textContent = '';
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/reports', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Token': token },
        body: JSON.stringify({ departmentId: Number(departmentId), reporterName, deviceName, devicePhoto, problemDesc, departmentHead })
      });
      const json = await res.json();
      if (json.code !== 0) { msg.textContent = json.message; submitBtn.disabled = false; return; }
      msg.style.color = '#27ae60';
      msg.textContent = '报修单已提交，待管理员受理 ✓';
      // 报修人停留本页，可继续报修其他设备
    } catch (e) {
      msg.textContent = '网络错误：' + e.message + '（内容已保留，请重试）';
      submitBtn.disabled = false;
    }
  });

  loadDepartments();
</script>
</body>
</html>
