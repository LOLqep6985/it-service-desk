<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0F6B5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="科室报修">
  <link rel="manifest" href="/manifest-report.json">
  <link rel="icon" href="/icons/report-192.png">
  <link rel="apple-touch-icon" href="/icons/report-192.png">
  <link rel="stylesheet" href="/css/dept-cascade.css">
  <link rel="stylesheet" href="/css/signature-pad.css">
  <title>科室报修 - IT运维工单系统</title>
  <style>
    /* ============================================================
       科室报修端 ——「纸单」构图
       纸白暖底 + 墨青绿品牌；全页即一张单子，无实色 header 条。
       ============================================================ */
    :root {
      --c-primary: #0F6B5C;
      --c-primary-dark: #0B5448;
      --c-primary-soft: #E2EFEA;
      --c-bg: #F6F4EE;
      --c-surface: #FFFFFF;
      --c-surface-2: #F0EDE4;
      --c-text: #1C2420;
      --c-text-2: #4A524D;
      --c-muted: #6E7770;
      --c-danger: #B3261E;
      --c-warn: #B45309;
      --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-num: "SF Mono", Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--c-bg); color: var(--c-text); }

    /* 单据抬头：纸白大标题区，科室名是主角；右上角放操作按钮（与管理后台同款 ghost 按钮） */
    .masthead { max-width: 560px; margin: 0 auto; padding: 28px 20px 0; display: flex; align-items: flex-start; gap: 12px; }
    .masthead-main { flex: 1; min-width: 0; }
    .masthead-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; margin-left: auto; padding-top: 2px; }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--c-surface-2); color: var(--c-text-2);
      border: none; border-radius: 6px; padding: 7px 12px;
      font-size: 13px; font-family: var(--font); cursor: pointer;
      white-space: nowrap; transition: background .15s ease;
    }
    .btn-ghost:hover { background: #E5E1D5; }
    .btn-ghost:active { background: #DAD5C6; }
    .masthead .kicker { font-size: 13px; color: var(--c-muted); letter-spacing: .12em; }
    .masthead h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: var(--c-text); margin-top: 6px; line-height: 1.2; }
    .masthead .sub { font-size: 14px; color: var(--c-muted); margin-top: 6px; }
    /* 窄屏：操作按钮换行到标题下方独占一行，标题占满整行横向排布；
       科室名长时字号自动收缩（clamp 上限随宽度，长标题由 JS 再降一档） */
    @media (max-width: 600px) {
      .masthead { flex-wrap: wrap; }
      .masthead-main { flex: 1 1 100%; min-width: 0; }
      .masthead-actions { flex: 1 1 100%; margin-left: 0; padding-top: 10px; justify-content: flex-end; }
      .masthead h1 { font-size: clamp(20px, 6vw, 26px); }
      .masthead h1.long-title { font-size: clamp(16px, 4.6vw, 20px); }
    }

    .container { max-width: 560px; margin: 0 auto; padding: 20px 20px 48px; }

    /* 全页即单子：卡片退化为分组块，无白卡堆叠 */
    .card { background: var(--c-surface); border-radius: 12px; padding: 22px 20px; margin-bottom: 18px; }
    .card h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; color: var(--c-text); }

    /* 单据抬头带：当前科室，墨绿浅底实色带 */
    .dept-box { background: var(--c-primary-soft); border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; color: var(--c-text); line-height: 1.6; }
    .dept-box b { color: var(--c-primary-dark); }

    label { display: block; font-size: 13px; color: var(--c-text-2); margin: 14px 0 6px; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; background: var(--c-surface-2); color: var(--c-text); font-family: var(--font); }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--c-primary); outline-offset: -1px; background: #fff; }
    input[readonly] { color: var(--c-muted); }
    textarea { min-height: 70px; line-height: 1.55; }

    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .tag { background: var(--c-surface-2); border: none; border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--c-text-2); cursor: pointer; }
    .tag.active { background: var(--c-primary); color: #fff; }

    /* 落款式主按钮：全宽实心墨青 */
    button.primary { width: 100%; padding: 15px; background: var(--c-primary); color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: 700; margin-top: 18px; letter-spacing: .02em; cursor: pointer; }
    button.primary:active { background: var(--c-primary-dark); }
    button.primary:disabled { background: #B9BDB4; }

    .msg { margin-top: 12px; text-align: center; font-size: 14px; color: var(--c-danger); min-height: 18px; }

    /* 时间线列表：左侧竖线 + 状态圆点，替代白卡堆叠 */
    .history-item, .accept-item { position: relative; padding: 12px 0 12px 22px; font-size: 14px; line-height: 1.7; }
    .history-item::before, .accept-item::before {
      content: ''; position: absolute; left: 5px; top: 20px; width: 9px; height: 9px; border-radius: 50%;
      background: var(--c-primary);
    }
    .history-item::after, .accept-item::after {
      content: ''; position: absolute; left: 9px; top: 32px; bottom: -2px; width: 1px; background: var(--c-surface-2);
    }
    .history-item:last-child::after, .accept-item:last-child::after { display: none; }
    .history-item .no, .accept-item .no { font-weight: 700; color: var(--c-primary); font-family: var(--font-num); }
    .accept-item .sign-btn { margin-top: 8px; background: var(--c-primary); color: #fff; border: none; border-radius: 7px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .accept-item .sign-btn.secondary { background: var(--c-surface-2); color: var(--c-text-2); }

    .bind-row { display: flex; gap: 8px; }
    .bind-row input { flex: 1; }
    .bind-row button { width: 90px; background: var(--c-primary); color: #fff; border: none; border-radius: 8px; font-size: 14px; }

    /* 三级联动（院区→楼栋→科室）的 .picker / .floor-chip 样式见 /css/dept-cascade.css（与 create.html 共用） */

    /* 签字弹窗 */
    .modal-mask { position: fixed; inset: 0; background: rgba(18,24,21,.5); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-mask.show { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 22px 20px; width: 94vw; max-width: 460px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
    .modal .info { font-size: 13px; color: var(--c-text-2); background: var(--c-bg); border-radius: 8px; padding: 12px; margin-bottom: 12px; line-height: 1.7; }
    /* 签字弹窗费用明细：核价后费用透明展示 */
    .modal .cost-title { font-size: 13px; font-weight: 600; color: var(--c-text); margin-bottom: 6px; }
    .modal .cost-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 0; }
    .modal .cost-row:last-child { padding-bottom: 0; }
    .modal .cost-name { font-size: 13px; color: var(--c-text-2); min-width: 0; }
    .modal .cost-price { font-size: 13px; color: var(--c-text); white-space: nowrap; font-family: var(--font-num); }
    .modal .cost-total { margin-top: 8px; padding-top: 10px; box-shadow: inset 0 1px 0 var(--c-surface-2); }
    .modal .cost-total .cost-name { font-weight: 700; color: var(--c-text); }
    /* 签名板 .sig-* 样式见 /css/signature-pad.css（组件共用） */
    canvas { width: 100%; height: 140px; display: block; touch-action: none; }
    .modal .actions { display: flex; gap: 8px; margin-top: 14px; }
    .modal .actions button { flex: 1; padding: 13px; border: none; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-clear { background: var(--c-surface-2); color: var(--c-text-2); }
    .btn-confirm { background: var(--c-primary); color: #fff; }
    .btn-cancel { background: var(--c-surface-2); color: var(--c-text-2); }
    .modal .msg { font-size: 13px; }
    .delegate-row { display: none; }
    .delegate-row.show { display: block; }
  </style>
</head>
<body>
<div class="masthead">
  <div class="masthead-main">
    <div class="kicker">IT 运维 · 免登录报修台</div>
    <h1 id="mastTitle">科室报修</h1>
    <div class="sub" id="mastSub">本机绑定科室后，提交报修无需再选科室</div>
  </div>
  <div class="masthead-actions">
    <button id="rebindBtn" class="btn-ghost" style="display:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      重新绑定科室
    </button>
    <button id="exitBtn" class="btn-ghost">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H4"/><path d="M8 8l-4 4 4 4"/><path d="M12 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/></svg>
      退出
    </button>
  </div>
</div>
<div class="container">
  <div class="card" id="bindCard">
    <h2>首次使用 · 绑定科室</h2>
    <p style="font-size:13px;color:#6b7280;line-height:1.7;">
      这是本科室专用工作机。请依次选择<b>院区 → 楼栋 → 科室</b>，绑定一次后，本机之后报修<b>无需再选择科室</b>。
    </p>
    <label>院区 *</label>
    <select id="campusSelect"><option value="">请选择院区</option></select>
    <label>楼栋 *</label>
    <select id="buildingSelect" disabled><option value="">请先选择院区</option></select>
    <label>科室 *</label>
    <div class="picker" id="deptPicker">
      <button type="button" class="picker-value" id="deptPickerValue" disabled>请先选择楼栋<span class="arrow">▾</span></button>
      <div class="picker-panel" id="deptPickerPanel"></div>
    </div>
    <button class="primary" id="bindBtn" style="margin-top:14px;">绑定</button>
    <div class="msg" id="bindMsg"></div>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <h2>报修单</h2>
    <div class="dept-box" id="deptBox">科室：加载中...</div>
    <label>报修人姓名 *</label>
    <input id="reporterName" placeholder="如：李护士">
    <label>设备名称 *</label>
    <select id="deviceName">
      <option value="">请选择设备类型</option>
      <option value="打印机">打印机</option>
      <option value="电脑">电脑</option>
      <option value="显示器">显示器</option>
      <option value="网络设备">网络设备</option>
      <option value="其他">其他</option>
    </select>
    <label>问题描述</label>
    <textarea id="problemDesc" placeholder="简单描述问题"></textarea>
    <div class="tags" id="tags">
      <span class="tag">卡纸</span><span class="tag">缺墨</span><span class="tag">不亮</span><span class="tag">打不开机</span><span class="tag">网络不通</span>
    </div>
    <label>科室负责人 *</label>
    <input id="departmentHead" readonly>
    <button class="primary" id="submitBtn">提交报修单</button>
    <div class="msg" id="submitMsg"></div>
  </div>

  <div class="card" id="acceptCard" style="display:none;">
    <h2>待签字工单 <span id="acceptCount" style="font-size:13px;color:var(--c-primary);font-weight:600;"></span></h2>
    <div id="acceptList"><div class="history-item">加载中...</div></div>
  </div>

  <div class="card" id="reimbCard" style="display:none;">
    <h2>月度报销单 <span id="reimbCount" style="font-size:13px;color:var(--c-primary);font-weight:600;"></span></h2>
    <div id="reimbList"><div class="history-item">加载中...</div></div>
  </div>

  <div class="card" id="historyCard" style="display:none;">
    <h2>报修记录 <span style="font-size:13px;color:var(--c-muted);font-weight:normal;">（仅展示近 2 个月）</span></h2>
    <div id="historyList"><div class="history-item">加载中...</div></div>
  </div>
</div>

<!-- 签字弹窗 -->
<div class="modal-mask" id="signModal">
  <div class="modal">
    <h3 id="signModalTitle">签字验收</h3>
    <div class="info" id="signInfo">加载中...</div>
    <!-- 费用明细：签字前展示管理员核价后的耗材费用，签字即确认费用（对科室/管理员/财务透明） -->
    <div class="info" id="signCost" style="display:none;"></div>
    <label>签字人姓名 *</label>
    <input id="signerName" placeholder="护士长/科室主任姓名">
    <label id="delegateRowWrap" style="display:flex;align-items:center;gap:6px;margin-top:10px;">
      <input type="checkbox" id="delegateChk" style="width:auto;"> 代签（本人不在，他人代签）
    </label>
    <div class="delegate-row" id="delegateRow">
      <label>被代签人姓名 *</label>
      <input id="delegatedName" placeholder="本应签字的护士长/主任姓名">
    </div>
    <label>签名方式</label>
    <div class="sig-tabs" id="sigTabs">
      <button type="button" class="sig-tab active" data-mode="HANDWRITTEN">手写签名</button>
      <button type="button" class="sig-tab" data-mode="TYPED">输入姓名生成</button>
    </div>
    <div class="sig-canvas-wrap" id="sigWrap">
      <canvas id="signCanvas" class="sig-canvas"></canvas>
      <div class="sig-guide" id="sigGuide">请在此处签名</div>
    </div>
    <div class="sig-actions">
      <button type="button" class="sig-btn" id="undoSign">撤销一笔</button>
      <button type="button" class="sig-btn" id="clearSign">全部清除</button>
    </div>
    <div class="sig-mode-box" id="sigTypedBox">
      <label>签字人姓名（用于生成签名）*</label>
      <input class="sig-name-input" id="typedSignName" placeholder="如：王护士长">
      <div class="sig-note warn">便捷模式：签字方式会记录为「输入姓名生成」；医院正式流程建议使用手写签名。</div>
    </div>
    <div class="actions">
      <button class="btn-cancel" id="cancelSign">取消</button>
      <button class="btn-confirm" id="confirmSign">确认验收</button>
    </div>
    <div class="msg" id="signMsg"></div>
  </div>
</div>

<!-- 维修详情弹窗 -->
<div class="modal-mask" id="detailModal">
  <div class="modal">
    <h3>维修记录详情</h3>
    <div class="info" id="detailInfo">加载中...</div>
    <div class="actions">
      <button class="btn-cancel" id="closeDetail">关闭</button>
    </div>
  </div>
</div>

<script src="/js/department-cascade.js"></script>
<script src="/js/signature-pad.js"></script>
<script>
  const REPORT_STATUS = { PENDING:'待受理', DISPATCHED:'已派单', COMPLETED:'已完成', REIMBURSED:'已报销', CANCELLED:'已取消' };
  const WO_STATUS = { ASSIGNED:'待接单', IN_PROGRESS:'维修中', PENDING_PRICING:'待核价', PENDING_SIGN:'待签字', PENDING_REIMBURSE:'待报销', REIMBURSED:'已报销' };
  const REIMB_STATUS = { PENDING_SIGN:'待签字', PENDING_REIMBURSE:'待报销', REIMBURSED:'已报销' };
  const SIGN_TYPE = { HANDWRITTEN:'手写签名', TYPED:'输入姓名生成' };
  function signTypeLabel(code) { return SIGN_TYPE[code] || '未记录'; }
  const bindCard = document.getElementById('bindCard');
  const formCard = document.getElementById('formCard');
  const acceptCard = document.getElementById('acceptCard');
  const historyCard = document.getElementById('historyCard');
  const reimbCard = document.getElementById('reimbCard');
  const bindMsg = document.getElementById('bindMsg');
  const submitMsg = document.getElementById('submitMsg');
  const submitBtn = document.getElementById('submitBtn');
  const DUPLICATE_MINUTES = 1;   // 仅防手抖重复点击；重复判定口径见后端 ReportService（同科室+设备+报修人+描述，3 分钟）
  let countdownTimer = null;
  let departmentId = Number(localStorage.getItem('itsdDepartmentId')) || null;
  let selectedDeptId = null;   // 三级联动当前选中的科室（点击「绑定」后落库到 localStorage）
  let currentSignWoId = null;
  let currentReimbId = null;
  // 服务端下发的可执行动作（动态权限）；用于签字前做一次前端校验
  let currentSignActions = [];

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // 三级联动（院区→楼栋→科室）逻辑在共用组件 /js/department-cascade.js（与 create.html 共用）
  const campusLabel = DeptCascade.campusLabel;
  const shortNameOf = DeptCascade.shortNameOf;
  const floorChip = DeptCascade.floorChip;
  const buildingOf = DeptCascade.buildingOf;

  function showBound(dept) {
    bindCard.style.display = 'none';
    formCard.style.display = 'block';
    acceptCard.style.display = 'block';
    reimbCard.style.display = 'block';
    historyCard.style.display = 'block';
    document.getElementById('rebindBtn').style.display = 'inline-flex';
    const building = buildingOf(dept);
    const mastTitle = document.getElementById('mastTitle');
    const title = esc(shortNameOf(dept)) + ' · 报修台';
    mastTitle.textContent = title;
    // 标题超过 9 个字符（长科室名）降一档字号，避免换行成竖字
    mastTitle.classList.toggle('long-title', title.length > 9);
    document.getElementById('mastSub').textContent =
      campusLabel(dept.campus) + (building ? ' · ' + building : '') + ' · 负责人：' + (dept.departmentHead || '未设置');
    document.getElementById('deptBox').innerHTML =
      '当前科室：' + floorChip(dept) + ' <b>' + esc(shortNameOf(dept)) + '</b>' +
      '<span style="color:var(--c-muted);font-size:12px;">　' + esc(campusLabel(dept.campus)) + (building ? ' · ' + esc(building) : '') + '</span>';
    const headInput = document.getElementById('departmentHead');
    headInput.value = dept.departmentHead || '';
    headInput.readOnly = !!dept.departmentHead;
  }

  async function loadDepartments() {
    try {
      const res = await fetch('/api/departments');
      const json = await res.json();
      return (json.code === 0 && json.data) ? json.data : [];
    } catch (e) {
      return [];
    }
  }

  // 三级联动实例：选中的科室存入 selectedDeptId，点击「绑定」后落 localStorage
  const cascade = DeptCascade.create({
    campusEl: document.getElementById('campusSelect'),
    buildingEl: document.getElementById('buildingSelect'),
    wrapEl: document.getElementById('deptPicker'),
    valueEl: document.getElementById('deptPickerValue'),
    panelEl: document.getElementById('deptPickerPanel'),
    onSelect: dept => { selectedDeptId = dept ? dept.id : null; },
    onChange: () => { bindMsg.textContent = ''; }
  });

  function doBind() {
    const dept = cascade.selected();
    if (!dept) { bindMsg.textContent = '请选择科室'; return; }
    localStorage.setItem('itsdDepartmentId', String(dept.id));
    localStorage.setItem('itsdDepartmentName', dept.name);
    location.reload();
  }

  document.getElementById('bindBtn').addEventListener('click', doBind);

  // 重新绑定：清掉本机科室绑定，回到绑定页（工作机换科室用）
  document.getElementById('rebindBtn').addEventListener('click', () => {
    if (!confirm('重新绑定后，本机将切换到新科室，确定继续？')) return;
    localStorage.removeItem('itsdDepartmentId');
    localStorage.removeItem('itsdDepartmentName');
    location.href = 'report.html';
  });

  // 退出：离开科室端回登录页（用 replace，避免浏览器返回键又回到本科室报修台）
  document.getElementById('exitBtn').addEventListener('click', () => {
    location.replace('login.html');
  });

  // 初始化：加载科室列表 → 三级联动（院区→楼栋→科室）→ 恢复本地绑定；支持 ?departmentId= 快捷绑定（扫码入口预留）
  (async function init() {
    cascade.setDepartments(await loadDepartments());

    const urlDeptId = new URLSearchParams(location.search).get('departmentId');
    const targetId = urlDeptId ? Number(urlDeptId) : departmentId;
    if (targetId) {
      const dept = cascade.byId(targetId);
      if (dept) {
        localStorage.setItem('itsdDepartmentId', String(dept.id));
        localStorage.setItem('itsdDepartmentName', dept.name);
        departmentId = dept.id;
        showBound(dept);
        loadAccept();
        loadReimbursements();
        loadHistory();
        return;
      }
      localStorage.removeItem('itsdDepartmentId');
      localStorage.removeItem('itsdDepartmentName');
    }

      if (tag.classList.contains('active')) {
        textarea.value = textarea.value ? textarea.value + '，' + tagText : tagText;

        textarea.value = textarea.value.replace(new RegExp('(，?' + tagText + ')'), '');

  submitBtn.addEventListener('click', async () => {
    const reporterName = document.getElementById('reporterName').value.trim();
    const deviceName = document.getElementById('deviceName').value;
    const problemDesc = document.getElementById('problemDesc').value.trim();
    const departmentHead = document.getElementById('departmentHead').value.trim();
    if (!reporterName || !deviceName) { submitMsg.textContent = '请填写报修人姓名和设备名称'; return; }
    submitMsg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = '提交中...';
    try {
      const res = await fetch('/api/reports/anonymous', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ departmentId, reporterName, deviceName, problemDesc, departmentHead })
      });
      const json = await res.json();
      if (json.code !== 0) {
        submitMsg.textContent = json.message;
        submitBtn.disabled = false;
        submitBtn.textContent = '提交报修单';
        return;
      }
      resetForm();
      submitMsg.style.color = '#0F6B5C';
      submitMsg.textContent = '报修单已提交（如需报修其他设备，请等倒计时结束）';
      startCountdown(DUPLICATE_MINUTES * 60);
      loadAccept();
      loadHistory();

      submitMsg.textContent = '网络错误：' + err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = '提交报修单';

  function resetForm() {
    document.getElementById('reporterName').value = '';
    document.getElementById('deviceName').value = '';
    document.getElementById('problemDesc').value = '';

  function startCountdown(seconds) {
    if (countdownTimer) clearInterval(countdownTimer);
    submitBtn.disabled = true;
    countdownTimer = setInterval(() => {
      seconds--;
      if (seconds <= 0) {
        clearInterval(countdownTimer);
        submitBtn.disabled = false;
        submitBtn.textContent = '提交报修单';
        return;
      }
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      submitBtn.textContent = '请勿重复提交（' + m + ':' + s + '）';
    }, 1000);
  }

  // ---------- 签字 ----------
  // 共用签名板（js/signature-pad.js）：修复画布尺寸/线宽/撤销问题，并支持「输入姓名生成」便捷模式
  const signModal = document.getElementById('signModal');
  const sigPad = SignaturePad.create({
    canvas: document.getElementById('signCanvas'),

    onChange: function (s) {
      document.getElementById('sigWrap').classList.toggle('has-ink', !s.empty);

  function setSignMode(mode) {
    sigPad.setMode(mode);
    document.querySelectorAll('#sigTabs .sig-tab').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
    });
    document.getElementById('sigTypedBox').classList.toggle('active', mode === 'TYPED');
    document.getElementById('sigGuide').textContent = mode === 'TYPED' ? '输入姓名后自动生成签名' : '请在此处签名';
    if (mode === 'TYPED') {
      const typed = document.getElementById('typedSignName').value.trim();
      if (typed) sigPad.setTypedName(typed);
    }
    document.getElementById('signMsg').textContent = '';
  }

  document.querySelectorAll('#sigTabs .sig-tab').forEach(function (btn) {
    btn.addEventListener('click', function () { setSignMode(btn.getAttribute('data-mode')); });
  });
  document.getElementById('typedSignName').addEventListener('input', function (e) {
    sigPad.setTypedName(e.target.value.trim());
    document.getElementById('signMsg').textContent = '';
  });
  document.getElementById('undoSign').addEventListener('click', function () { sigPad.undo(); });
  document.getElementById('clearSign').addEventListener('click', function () {
    sigPad.clear();
    document.getElementById('typedSignName').value = '';
  });

  document.getElementById('delegateChk').addEventListener('change', (e) => {

  /** 打开签字弹窗时统一复位（含模式、姓名、代签、签名板、费用明细） */
  function resetSignPad() {
    sigPad.clear();
    currentSignActions = [];
    document.getElementById('typedSignName').value = '';
    document.getElementById('signMsg').textContent = '';
    document.getElementById('signMsg').style.color = '#B3261E';
    document.getElementById('signerName').value = '';
    document.getElementById('signerName').placeholder = '护士长/科室主任姓名';
    document.getElementById('delegatedName').value = '';
    document.getElementById('delegateChk').checked = false;

    const costBox = document.getElementById('signCost');

  async function openSign(woId) {
    currentSignWoId = woId;
    currentReimbId = null;
    document.getElementById('delegateRowWrap').style.display = 'flex';
    document.getElementById('signModalTitle').textContent = '签字验收';
    signModal.classList.add('show');
    resetSignPad();
    requestAnimationFrame(function () { sigPad.resize(); });   // 弹窗显示后才能量到真实尺寸
    try {
      // 并行拉详情 + 耗材费用（签字前展示核价后费用，签字即确认金额）
      const [detailRes, consRes] = await Promise.all([
        fetch('/api/work-orders/' + woId + '?departmentId=' + departmentId),
        fetch('/api/work-orders/' + woId + '/consumables?departmentId=' + departmentId)
      ]);
      const json = await detailRes.json();
      if (json.code === 0) {
        const detail = json.data || {};
        const wo = detail.workOrder || detail;
        currentSignActions = detail.allowedActions || [];
        document.getElementById('signInfo').innerHTML =
          '工单#' + wo.id + ' · ' + (wo.title || '') +
          '<br>维修记录：' + (wo.repairRecord || '未填写');
      }
      const consJson = await consRes.json();
      renderSignCost(consJson.code === 0 ? (consJson.data || []) : []);
    } catch (e) {}
  }

  /**
   * 签字弹窗费用明细：耗材名 × 数量 × 核价单价，未核价的标出并计入合计为 0；
   * 护士长签字 = 对费用与维修结果同时确认（对科室/管理员/财务透明，避免扯皮）
   */
  function renderSignCost(consumables) {
    const box = document.getElementById('signCost');
    const items = (consumables || []).filter(c => c.name);
    if (items.length === 0) { box.style.display = 'none'; box.innerHTML = ''; return; }
    let total = 0;
    let unpriced = 0;
    const rows = items.map(c => {
      const hasPrice = c.unitPrice !== null && c.unitPrice !== undefined;
      const sub = hasPrice ? Number(c.unitPrice) * (c.quantity || 1) : 0;
      if (hasPrice) total += sub; else unpriced++;
      return '<div class="cost-row">' +
        '<span class="cost-name">' + esc(c.name) + ' × ' + (c.quantity || 1) + '</span>' +
        '<span class="cost-price">' + (hasPrice ? '¥' + Number(c.unitPrice).toFixed(2) + (c.quantity > 1 ? ' × ' + c.quantity : '') + ' = ¥' + sub.toFixed(2) : '<b style="color:#B3261E;">未核价</b>') + '</span>' +
        '</div>';
    }).join('');
    box.innerHTML =
      '<div class="cost-title">维修费用明细' + (unpriced > 0 ? '（<span style="color:#B3261E;">' + unpriced + ' 项未核价</span>，请先联系管理员核价）' : '') + '</div>' +
      rows +
      '<div class="cost-row cost-total"><span class="cost-name">合计金额</span>' +
      '<span class="cost-price"><b style="color:#0F6B5C;font-size:15px;">¥' + total.toFixed(2) + '</b></span></div>';
    box.style.display = 'block';
  }

  document.getElementById('confirmSign').addEventListener('click', async () => {
    const signMsgEl = document.getElementById('signMsg');
    const signerName = document.getElementById('signerName').value.trim();
    const isDelegate = document.getElementById('delegateChk').checked;
    const delegatedName = document.getElementById('delegatedName').value.trim();
    const signMode = sigPad.getMode();
    if (!signerName) { signMsgEl.textContent = '请填写签字人姓名'; return; }
    if (currentReimbId == null && isDelegate && !delegatedName) { signMsgEl.textContent = '请填写被代签人姓名'; return; }
    // 服务端已判定不可签字时提前拦下（报销单签字走另一套权限，不做此校验）
    if (currentReimbId == null && currentSignActions.length > 0 && currentSignActions.indexOf('SIGN') < 0) {
      signMsgEl.textContent = '该工单当前不可签字（可能已被签字或状态已变更），请刷新后重试';
      return;
    }
    if (signMode === 'TYPED') {
      const typed = document.getElementById('typedSignName').value.trim();
      if (!typed) { signMsgEl.textContent = '请输入姓名以生成签名'; return; }
      sigPad.setTypedName(typed);
    }
    if (sigPad.isEmpty()) { signMsgEl.textContent = signMode === 'TYPED' ? '请输入姓名以生成签名' : '请先手写签名'; return; }

    signMsgEl.textContent = '提交中...';
    document.getElementById('confirmSign').disabled = true;
    try {
      // 导出签名图（组件已自动裁剪空白 + 留白）并上传
      const blob = await sigPad.toBlob();
      if (!blob) { signMsgEl.textContent = '签名生成失败，请重试'; document.getElementById('confirmSign').disabled = false; return; }
      const fd = new FormData();
      fd.append('file', blob, 'signature.png');
      const up = await (await fetch('/api/files/upload', { method: 'POST', body: fd })).json();
      if (up.code !== 0) { signMsgEl.textContent = up.message; document.getElementById('confirmSign').disabled = false; return; }
      const signatureUrl = up.data.url;
      let json;
      if (currentReimbId != null) {
        // 报销单签字：提交财务（带签字方式）
        const res = await fetch('/api/reimbursements/' + currentReimbId + '/sign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ departmentId, signerName, signatureUrl, signType: signMode })
        });
        json = await res.json();
      } else {
        // 工单验收签字（带签字方式）
        const res = await fetch('/api/work-orders/' + currentSignWoId + '/sign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ departmentId, signerName, isDelegate, delegatedName, signatureUrl, signType: signMode })
        });
        json = await res.json();
      }
      if (json.code !== 0) { signMsgEl.textContent = json.message; document.getElementById('confirmSign').disabled = false; return; }
      signMsgEl.style.color = '#0F6B5C';
      signMsgEl.textContent = currentReimbId != null ? '报销单签字成功' : '验收签字成功';
      setTimeout(() => {
        signModal.classList.remove('show');
        document.getElementById('confirmSign').disabled = false;
        const savedReimbId = currentReimbId;
        currentReimbId = null;
        currentSignWoId = null;
        if (savedReimbId != null) { loadReimbursements(); } else { loadAccept(); loadHistory(); }
      }, 1000);
    } catch (e) {
      signMsgEl.textContent = '网络错误：' + e.message;
      document.getElementById('confirmSign').disabled = false;
    }
  });

  // ---------- 历史列表（报修单为主轴，附带工单真实状态/签字信息）----------
  // 报修单 status 由工单流转回写：PENDING 待受理 → DISPATCHED 已派单 → COMPLETED 已完成
  // 此列表替代旧版「已完成工单」卡片，让一条报修单的全生命周期一目了然
  async function loadHistory() {
    const host = document.getElementById('historyList');
    try {
      // 并发拉报修单 + 本科室全部工单（按 reportId 建索引，附带工单号/签字/完成时间）
      const [reportRes, woRes] = await Promise.all([
        fetch('/api/reports/by-department?departmentId=' + departmentId),
        fetch('/api/work-orders/by-department?departmentId=' + departmentId)
      ]);
      const reportJson = await reportRes.json();
      if (reportJson.code !== 0) { host.innerHTML = '<div class="history-item">' + reportJson.message + '</div>'; return; }
      const woJson = await woRes.json();
      const woList = (woJson.code === 0 ? (woJson.data || []) : []);
      // 按 reportId 取最新一条工单（同一报修单理论上只派一次，防御性取最新）
      const woByReport = {};
      woList.forEach(wo => { if (wo.reportId != null) { woByReport[wo.reportId] = wo; } });

      const list = reportJson.data || [];
      if (list.length === 0) { host.innerHTML = '<div class="history-item">暂无报修记录</div>'; return; }
      host.innerHTML = list.map(r => {
        const wo = woByReport[r.id];
        const statusLabel = REPORT_STATUS[r.status] || r.status || '';
        // 已完成：附带签字人/完成时间；已派单：附带工单号；待受理：纯报修单
        let extra = '';
        if (wo) {
          if (r.status === 'COMPLETED' || r.status === 'REIMBURSED') {
            extra = '<br><span style="color:' + (r.status === 'REIMBURSED' ? '#7A5C2E' : '#0F6B5C') + ';">工单#' + wo.id + ' · ' + (REPORT_STATUS[r.status] || r.status) + ' · 签字人：' + esc(wo.signedBy || '未填写') + ' · ' + ((wo.signedAt || wo.completedAt || '').replace('T',' ').slice(0,16)) + '</span>';
          } else {
            extra = '<br><span style="color:#6b7280;">工单#' + wo.id + ' · 处理中</span>';
          }
          extra += '<br><button class="sign-btn" onclick="openHistoryDetail(' + wo.id + ')">查看详情</button>';
        }
        return '<div class="history-item"><span class="no">' + (r.reportNo || r.id) + '</span> ' + esc(r.deviceName || '') +
          ' · ' + statusLabel +
          ' · ' + ((r.createdAt || '').replace('T', ' ').slice(0, 16)) + extra + '</div>';
      }).join('');
    } catch (e) {
      host.innerHTML = '<div class="history-item">加载失败</div>';
    }
  }

  // 历史详情（工单维度）：展示维修记录/耗材/签字留痕

      const costRows = consumables.filter(c => c.name).map(c => {

        ? '<div class="cost-title">维修费用明细' + (unpriced > 0 ? '（<span style="color:#B3261E;">' + unpriced + ' 项未核价</span>）' : '') + '</div>' + costRows +
          '<div class="cost-row cost-total"><span class="cost-name">合计金额</span><span class="cost-price"><b style="color:#0F6B5C;font-size:15px;">¥' + total.toFixed(2) + '</b></span></div>'
        : '<div style="color:#6b7280;">无耗材费用</div>';
      const sigImg = wo.signatureUrl
        ? '<div style="margin-top:8px;"><img src="' + wo.signatureUrl + '" onclick="window.open(this.src)" style="max-width:100%;border-radius:6px;cursor:zoom-in;" alt="手写签名"></div>'
        : '<div style="color:#6b7280;">无签名图片</div>';
      info.innerHTML =
        '<b>工单#' + wo.id + '</b> ' + esc(wo.title || '') +
        '<br><br><b>维修记录：</b>' + esc(wo.repairRecord || '未填写') +
        '<br><b>耗材：</b>' + consHtml +
        '<br><br><b>报修费用：</b>' +
        '<div style="margin-top:6px;padding:8px 10px;background:#f8fafc;border-radius:8px;">' + costHtml + '</div>' +
        '<br><b>签字状态：</b>' + (wo.signStatus === 'SIGNED' ? '已签字' : '待签字') +
        '<br><b>签字方式：</b>' + signTypeLabel(wo.signType) +
        '<br><b>签字人：</b>' + esc(wo.signedBy || '未填写') +
        '<br><b>签字时间：</b>' + ((wo.signedAt || '').replace('T',' ').slice(0,16) || '未填写') +
        '<br><b>签名图片：</b>' + sigImg;
    } catch (e) {
      info.innerHTML = '加载失败：' + e.message;
    }
  }
</script>
<script>
  // PWA：注册 Service Worker（HTTPS 或 localhost 下生效；局域网 http 不影响正常使用）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/service-worker.js').catch(function () {});
    });
  }
</script>
<script src="/js/pwa-install.js"></script>
</body>
</html>
