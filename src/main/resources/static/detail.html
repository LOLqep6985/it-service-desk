<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#10181D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="维修工作台">
  <link rel="manifest" href="/manifest-repairer.json">
  <link rel="icon" href="/icons/repair-192.png">
  <link rel="apple-touch-icon" href="/icons/repair-192.png">
  <title>工单详情 - IT运维工单系统</title>
  <style>
    /* ============================================================
       工单详情（维修工端）—— 深色工具箱，与 today.html 同族
       ============================================================ */
    :root {
      --dk-bg: #10181D;
      --dk-surface: #1A242B;
      --dk-surface-2: #232F38;
      --dk-text: #E8EDE9;
      --dk-text-2: #9AA8A0;
      --dk-accent: #4ADE9E;
      --dk-accent-ink: #0C1A13;
      --dk-danger: #F0705E;
      --dk-warn: #E8B25A;
      --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      --font-num: "SF Mono", Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--dk-bg); color: var(--dk-text); }
    .header { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; background: var(--dk-bg); position: sticky; top: 0; z-index: 10; }
    .header .back { background: var(--dk-surface-2); border: none; color: var(--dk-text); padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .header .t { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .container { max-width: 520px; margin: 0 auto; padding: 8px 16px 48px; }
    .card { background: var(--dk-surface); border-radius: 10px; padding: 20px 18px; }
    .card h2 { font-size: 21px; margin-bottom: 14px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; }
    .row .k { color: var(--dk-text-2); flex: 0 0 auto; }
    .row .v { text-align: right; max-width: 68%; word-break: break-word; }
    .badge { display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 4px; background: var(--dk-surface-2); color: var(--dk-accent); font-weight: 600; }
    .badge.sign-pending { background: rgba(232, 178, 90, .15); color: var(--dk-warn); }
    .form { background: var(--dk-surface); border-radius: 10px; padding: 20px 18px; margin-top: 14px; }
    .form h3 { font-size: 16px; margin-bottom: 12px; font-weight: 700; }
    .form p { color: var(--dk-text-2); }
    textarea, input[type=text], input[type=number] {
      width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px;
      background: var(--dk-surface-2); color: var(--dk-text); font-family: var(--font);
    }
    textarea:focus, input:focus { outline: 2px solid var(--dk-accent); outline-offset: -1px; }
    textarea { min-height: 90px; line-height: 1.55; }
    .consumable-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
    .consumable-row input { flex: 1; min-width: 70px; }
    .consumable-row .cb { flex: 0 0 auto; display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--dk-text-2); }
    .add-row { color: var(--dk-accent); font-size: 14px; font-weight: 600; border: none; background: none; cursor: pointer; margin-bottom: 8px; padding: 4px 0; }
    /* 吸底式大按钮 */
    button.primary { width: 100%; padding: 16px; background: var(--dk-accent); color: var(--dk-accent-ink); border: none; border-radius: 10px; font-size: 16px; font-weight: 700; margin-top: 14px; cursor: pointer; letter-spacing: .02em; }
    button.primary.green { background: var(--dk-accent); }
    button.primary:disabled { background: #3A4540; color: var(--dk-text-2); }
    .msg { margin-top: 12px; text-align: center; font-size: 14px; color: var(--dk-danger); min-height: 20px; }
  </style>
</head>
<body>
<div class="header">
  <button class="back" id="backBtn">‹ 返回</button>
  <span class="t">工单详情</span>
  <button class="back logout-btn" id="logoutBtn" style="margin-left:auto;">退出</button>
</div>
<div class="container">
  <div class="card" id="card">加载中...</div>
  <div class="form" id="acceptBox" style="display:none;">
    <h3>确认接单</h3>
    <p style="font-size:13px;color:#6b7280;">接单后开始处理，请尽快到场确认。</p>
    <button class="primary green" id="acceptBtn">接单</button>
    <div class="msg" id="acceptMsg"></div>
  </div>
  <div class="form" id="repairBox" style="display:none;">
    <h3>维修记录</h3>
    <textarea id="record" placeholder="填写故障原因、处理方式、维修结果等"></textarea>
    <h3 style="margin-top:12px;">耗材 / 欠条</h3>
    <div id="consumableRows"></div>
    <button class="add-row" id="addConsumableBtn">＋ 添加耗材/欠条</button>
    <button class="primary" id="submitBtn">提交并关闭工单</button>
    <div class="msg" id="repairMsg"></div>
  </div>
</div>
<script src="/js/guard.js"></script>
<script>
  // 端守卫：只有维修工可停留本端；其他角色提示后强制退出回登录页（三端隔离，不跨端跳转）
  const guardUser = ItsdGuard.guard('repairer');
  if (!guardUser) throw new Error('blocked');
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const userId = guardUser.userId || params.get('userId');
  const user = guardUser;
  const token = user.token || '';
  const WORK_ORDER_STATUS = { ASSIGNED:'待接单', IN_PROGRESS:'维修中', PENDING_PRICING:'待核价', PENDING_SIGN:'待签字', PENDING_REIMBURSE:'待报销', REIMBURSED:'已报销' };
  const CAMPUS_LABEL = { LAOYUAN:'老院', XIYUAN:'西院', DONGYUAN:'东院' };
  const isRepairer = true;   // 守卫通过即维修工
  const card = document.getElementById('card');
  const repairBox = document.getElementById('repairBox');
  const acceptBox = document.getElementById('acceptBox');
  const repairMsg = document.getElementById('repairMsg');
  const acceptMsg = document.getElementById('acceptMsg');

  document.getElementById('logoutBtn').addEventListener('click', () => {
    ItsdGuard.logout();
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'today.html?userId=' + userId;
  });

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtTime(s) { return (s || '').replace('T', ' ').slice(0, 16); }

  document.getElementById('acceptBtn').addEventListener('click', async () => {
    acceptMsg.textContent = '接单中...';
    try {
      const res = await fetch('/api/work-orders/' + id + '/accept', { method: 'POST', headers: { 'X-Token': token } });
      const json = await res.json();
      if (json.code !== 0) { acceptMsg.textContent = json.message; return; }
      acceptMsg.style.color = '#4ADE9E';
      acceptMsg.textContent = '已接单，请填写维修记录';
      load();
    } catch (e) { acceptMsg.textContent = '网络错误：' + e.message; }
  });

  document.getElementById('addConsumableBtn').addEventListener('click', () => addConsumableRow());

  function addConsumableRow() {
    const div = document.createElement('div');
    div.className = 'consumable-row';
    div.innerHTML =
      '<input type="text" class="c-name" placeholder="耗材名（如硒鼓）">' +
      '<input type="number" class="c-qty" placeholder="数量" style="max-width:70px;">' +
      '<button class="add-row" onclick="this.parentNode.remove()">×</button>';
    document.getElementById('consumableRows').appendChild(div);
  }
  addConsumableRow();

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const record = document.getElementById('record').value.trim();
    if (!record) { repairMsg.textContent = '请填写维修记录'; return; }
    const consumables = [];
    document.querySelectorAll('.consumable-row').forEach(row => {
      const name = row.querySelector('.c-name').value.trim();
      if (!name) return;
      consumables.push({
        name,
        quantity: Number(row.querySelector('.c-qty').value) || 1
      });
    });
    repairMsg.textContent = '提交中...';
    document.getElementById('submitBtn').disabled = true;
    try {
      const res = await fetch('/api/work-orders/' + id + '/repair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Token': token },
        body: JSON.stringify({ record, consumables })
      });
      const json = await res.json();
      if (json.code !== 0) { repairMsg.textContent = json.message; document.getElementById('submitBtn').disabled = false; return; }
      repairMsg.style.color = '#4ADE9E';
      repairMsg.textContent = '已提交科室验收，等待护士长签字';
      setTimeout(() => { window.location.href = 'today.html?userId=' + userId; }, 1200);
    } catch (e) {
      repairMsg.textContent = '网络错误：' + e.message;
      document.getElementById('submitBtn').disabled = false;
    }
  });

  async function load() {
    const res = await fetch('/api/work-orders/' + id, { headers: { 'X-Token': token } });
    const json = await res.json();
    if (json.code !== 0) { card.innerHTML = json.message; return; }
    // 详情响应结构：{ workOrder, allowedActions, reportNo, reimbursement }
    const detail = json.data || {};
    const wo = detail.workOrder || detail;
    const allowed = detail.allowedActions || [];
    const statusLabel = WORK_ORDER_STATUS[wo.status] || wo.status;
    const signLabel = wo.signStatus === 'SIGNED' ? '已签字' : '待签字';
    const rows = [
      ['状态', '<span class="badge">' + statusLabel + '</span>'],
      ['签字', '<span class="badge sign-pending">' + signLabel + '</span>'],
      ['标题', esc(wo.title)],
      ['描述', esc(wo.description)],
      ['院区', esc(CAMPUS_LABEL[wo.campus] || wo.campus)],
      ['科室', esc(wo.departmentName)],
      ['地点', esc(wo.location)],
      ['联系人', esc(wo.contactPerson)],
      ['联系电话', esc(wo.contactPhone)],
      ['创建时间', fmtTime(wo.createdAt)]
    ];
    // 维修提交关闭后（待核价及之后）显示维修记录与完成时间
    var afterRepair = ['PENDING_PRICING', 'PENDING_SIGN', 'PENDING_REIMBURSE', 'REIMBURSED'].indexOf(wo.status) >= 0;
    if (afterRepair) {
      rows.push(['维修记录', esc(wo.repairRecord)]);
      rows.push(['完成时间', fmtTime(wo.completedAt)]);
    }
    card.innerHTML = '<h2>' + esc(wo.title) + '</h2>' + rows.map(r => '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>').join('');

    repairBox.style.display = 'none';
    acceptBox.style.display = 'none';
    // 动作可见性由服务端 allowedActions 决定（动态权限：派单后可接单，待签字后只读）
    if (allowed.indexOf('REPAIR') >= 0) {
      repairBox.style.display = 'block';
    } else if (allowed.indexOf('ACCEPT') >= 0) {
      acceptBox.style.display = 'block';
    } else if (isRepairer && wo.status === 'ASSIGNED') {
      acceptBox.style.display = 'block';   // 兜底：老接口/字段缺失时保持原行为
    } else if (isRepairer && wo.status === 'IN_PROGRESS') {
      repairBox.style.display = 'block';
    }
  }

  load();
</script>
<script>
  // PWA：注册 Service Worker（HTTPS 或 localhost 下生效）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/service-worker.js').catch(function () {});
    });
  }
</script>
<script src="/js/pwa-install.js"></script>
</body>
</html>
